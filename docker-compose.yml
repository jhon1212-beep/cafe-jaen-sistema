# Desarrollo local: base de datos + API.  El front-end se levanta con `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe_jaen
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafe_jaen"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://cafe:cafe@db:5432/cafe_jaen
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
