# Integración continua (práctica XP): cada push y PR se verifica completo
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Script de tareas (dev.py)
        working-directory: .
        run: python dev.py --help
      - name: Estilo (ruff)
        run: ruff check . && ruff format --check .
      - name: Tipos (mypy)
        run: mypy
      - name: Arquitectura hexagonal (import-linter)
        run: PYTHONPATH=src lint-imports
      - name: Pruebas (unitarias, integración y aceptación)
        run: pytest --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
