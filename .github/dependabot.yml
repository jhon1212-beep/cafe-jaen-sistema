# Actualizaciones automáticas: cada semana se abre un PR por dependencia desactualizada.
# La CI revisa cada PR; si queda en verde, se puede aceptar con confianza.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las herramientas de desarrollo se actualizan juntas en un solo PR
      dev-tools:
        dependency-type: development
    # Se mantienen las versiones mayores que funcionan con Node 22.11 (computadoras del equipo);
    # Vite 7+, Vitest 4+, ESLint 10 y jsdom 27+ exigen Node 22.12 o superior.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-plugin-pwa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
