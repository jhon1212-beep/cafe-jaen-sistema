[project]
name = "cafe-jaen-backend"
version = "1.0.0"
description = "API y sistema multiagente de la aplicación web para caficultores de Jaén (tesis UPAO 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.156.4",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.13",
    "pydantic-settings==2.16.1",
    "apscheduler==3.11.3",
    "langgraph==1.2.16",
    "httpx==0.28.1",
    "yfinance==1.7.0",
    "numpy==2.5.4",
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "anthropic==1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "import-linter==2.15",
    "locust==2.46.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: los comentarios y textos en español usan caracteres como «» y –
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["shared", "identity", "market", "forecasting", "advisor", "orchestration"]
ignore_missing_imports = true
warn_unused_ignores = true

# Dominio y aplicación con tipado estricto: son el núcleo del negocio
[[tool.mypy.overrides]]
module = ["*.domain.*", "*.application.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing:skip-covered"

[tool.coverage.run]
omit = ["src/main.py", "*/infrastructure/sources/yahoo_*", "*/infrastructure/llm/anthropic_*"]
